<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-label="Nihar Neelala — AI Systems Engineer">
  <title>Nihar Neelala — AI Systems Engineer</title>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#080D18"/>
      <stop offset="45%"  stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#08111F"/>
    </linearGradient>

    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#6EE7B7"/>
      <stop offset="50%"  stop-color="#22D3EE"/>
      <stop offset="100%" stop-color="#818CF8"/>
    </linearGradient>

    <linearGradient id="waveGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#6EE7B7"/>
      <stop offset="55%"  stop-color="#22D3EE"/>
      <stop offset="100%" stop-color="#818CF8"/>
    </linearGradient>

    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#22D3EE" stop-opacity="0"/>
      <stop offset="50%"  stop-color="#22D3EE" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#818CF8" stop-opacity="0"/>
    </linearGradient>

    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%"   stop-color="#22D3EE" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>

    <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M34 0 L0 0 0 34" fill="none" stroke="#1E293B" stroke-width="1" opacity="0.55"/>
    </pattern>

    <style>
      .bar {
        transform-box: fill-box;
        transform-origin: center;
        animation: eq 1.5s ease-in-out infinite;
      }
      @keyframes eq {
        0%, 100% { transform: scaleY(0.22); opacity: 0.55; }
        50%      { transform: scaleY(1);    opacity: 1; }
      }
      .b1  { animation-delay: -0.05s } .b2  { animation-delay: -0.62s }
      .b3  { animation-delay: -0.28s } .b4  { animation-delay: -0.95s }
      .b5  { animation-delay: -0.41s } .b6  { animation-delay: -1.12s }
      .b7  { animation-delay: -0.18s } .b8  { animation-delay: -0.77s }
      .b9  { animation-delay: -1.31s } .b10 { animation-delay: -0.35s }
      .b11 { animation-delay: -0.88s } .b12 { animation-delay: -0.11s }
      .b13 { animation-delay: -1.05s } .b14 { animation-delay: -0.52s }
      .b15 { animation-delay: -1.24s } .b16 { animation-delay: -0.24s }
      .b17 { animation-delay: -0.71s } .b18 { animation-delay: -1.38s }
      .b19 { animation-delay: -0.44s } .b20 { animation-delay: -0.98s }
      .b21 { animation-delay: -0.15s } .b22 { animation-delay: -1.18s }
      .b23 { animation-delay: -0.58s } .b24 { animation-delay: -0.82s }
      .b25 { animation-delay: -0.31s } .b26 { animation-delay: -1.45s }
      .b27 { animation-delay: -0.67s } .b28 { animation-delay: -0.08s }

      .live {
        transform-box: fill-box;
        transform-origin: center;
        animation: blip 2s ease-in-out infinite;
      }
      @keyframes blip {
        0%, 100% { opacity: 1;    transform: scale(1); }
        50%      { opacity: 0.35; transform: scale(1.4); }
      }

      .sweep { animation: slide 4s linear infinite; }
      @keyframes slide {
        0%   { transform: translateX(-320px); }
        100% { transform: translateX(1240px); }
      }

      @media (prefers-reduced-motion: reduce) {
        .bar, .live, .sweep { animation: none; }
        .bar { transform: scaleY(0.7); opacity: 0.9; }
      }
    </style>
  </defs>

  <!-- backdrop -->
  <rect width="1200" height="300" fill="url(#bg)"/>
  <rect width="1200" height="300" fill="url(#grid)"/>
  <ellipse cx="900" cy="150" rx="420" ry="200" fill="url(#glow)"/>
  <rect x="0" y="0" width="1200" height="300" fill="none" stroke="#1E293B" stroke-width="2"/>

  <!-- top accent rail -->
  <rect x="0" y="0" width="1200" height="3" fill="url(#accent)"/>
  <rect class="sweep" x="0" y="0" width="320" height="3" fill="#FFFFFF" opacity="0.55"/>

  <!-- ── left: identity ── -->
  <g transform="translate(64, 0)">
    <g transform="translate(0, 86)">
      <circle class="live" cx="6" cy="-4" r="4" fill="#6EE7B7"/>
      <text x="22" y="0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
            font-size="13" letter-spacing="3.2" fill="#7DD3FC" font-weight="600">
        AI SYSTEMS ENGINEER
      </text>
    </g>

    <text x="0" y="150" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif"
          font-size="52" font-weight="800" fill="#F8FAFC" letter-spacing="-1">
      Nihar Neelala
    </text>

    <text x="0" y="188" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif"
          font-size="19" font-weight="500" fill="#94A3B8">
      Real-time voice AI · agent architecture · distributed backends
    </text>

    <!-- stat chips -->
    <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="700">
      <g transform="translate(0, 214)">
        <rect width="150" height="30" rx="15" fill="#0B1220" stroke="#22D3EE" stroke-opacity="0.45"/>
        <text x="75" y="20" text-anchor="middle" fill="#67E8F9">&lt; 1s VOICE LATENCY</text>
      </g>
      <g transform="translate(162, 214)">
        <rect width="146" height="30" rx="15" fill="#0B1220" stroke="#6EE7B7" stroke-opacity="0.45"/>
        <text x="73" y="20" text-anchor="middle" fill="#6EE7B7">125K LINES SHIPPED</text>
      </g>
      <g transform="translate(320, 214)">
        <rect width="132" height="30" rx="15" fill="#0B1220" stroke="#818CF8" stroke-opacity="0.45"/>
        <text x="66" y="20" text-anchor="middle" fill="#A5B4FC">3 LANGUAGES LIVE</text>
      </g>
    </g>
  </g>

  <!-- ── right: live waveform ── -->
  <g transform="translate(700, 150)" fill="url(#waveGrad)">
    <rect class="bar b1"  x="0"   y="-26" width="9" height="52"  rx="4.5"/>
    <rect class="bar b2"  x="16"  y="-44" width="9" height="88"  rx="4.5"/>
    <rect class="bar b3"  x="32"  y="-18" width="9" height="36"  rx="4.5"/>
    <rect class="bar b4"  x="48"  y="-58" width="9" height="116" rx="4.5"/>
    <rect class="bar b5"  x="64"  y="-32" width="9" height="64"  rx="4.5"/>
    <rect class="bar b6"  x="80"  y="-70" width="9" height="140" rx="4.5"/>
    <rect class="bar b7"  x="96"  y="-24" width="9" height="48"  rx="4.5"/>
    <rect class="bar b8"  x="112" y="-52" width="9" height="104" rx="4.5"/>
    <rect class="bar b9"  x="128" y="-38" width="9" height="76"  rx="4.5"/>
    <rect class="bar b10" x="144" y="-64" width="9" height="128" rx="4.5"/>
    <rect class="bar b11" x="160" y="-20" width="9" height="40"  rx="4.5"/>
    <rect class="bar b12" x="176" y="-48" width="9" height="96"  rx="4.5"/>
    <rect class="bar b13" x="192" y="-72" width="9" height="144" rx="4.5"/>
    <rect class="bar b14" x="208" y="-30" width="9" height="60"  rx="4.5"/>
    <rect class="bar b15" x="224" y="-56" width="9" height="112" rx="4.5"/>
    <rect class="bar b16" x="240" y="-22" width="9" height="44"  rx="4.5"/>
    <rect class="bar b17" x="256" y="-66" width="9" height="132" rx="4.5"/>
    <rect class="bar b18" x="272" y="-34" width="9" height="68"  rx="4.5"/>
    <rect class="bar b19" x="288" y="-50" width="9" height="100" rx="4.5"/>
    <rect class="bar b20" x="304" y="-16" width="9" height="32"  rx="4.5"/>
    <rect class="bar b21" x="320" y="-60" width="9" height="120" rx="4.5"/>
    <rect class="bar b22" x="336" y="-28" width="9" height="56"  rx="4.5"/>
    <rect class="bar b23" x="352" y="-42" width="9" height="84"  rx="4.5"/>
    <rect class="bar b24" x="368" y="-68" width="9" height="136" rx="4.5"/>
    <rect class="bar b25" x="384" y="-24" width="9" height="48"  rx="4.5"/>
    <rect class="bar b26" x="400" y="-46" width="9" height="92"  rx="4.5"/>
    <rect class="bar b27" x="416" y="-36" width="9" height="72"  rx="4.5"/>
    <rect class="bar b28" x="432" y="-14" width="9" height="28"  rx="4.5"/>
  </g>

  <!-- waveform caption -->
  <text x="700" y="252" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
        font-size="11.5" letter-spacing="2" fill="#64748B">
    EN · HI · TE  —  END-OF-SPEECH → FIRST AUDIO
  </text>

  <!-- bottom rail -->
  <rect x="0" y="297" width="1200" height="3" fill="url(#fade)"/>
</svg>
